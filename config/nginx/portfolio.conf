# Install as /etc/nginx/sites-available/portfolio.conf on Debian/Ubuntu.
# This whole file must be included from nginx's `http {}` context, as the
# standard sites-enabled directory is. Replace paths and server_name as needed.

proxy_cache_path /var/cache/nginx/portfolio
    levels=1:2
    keys_zone=portfolio_html:20m
    max_size=256m
    inactive=7d
    use_temp_path=off;

upstream portfolio_node {
    zone portfolio_node 64k;
    server 127.0.0.1:3000;
    keepalive 32;
}

# Only anonymous public documents are eligible for the HTML microcache.
map "$request_method:$uri" $portfolio_public_page {
    default                              0;
    "GET:/"                              1;
    "HEAD:/"                             1;
    "GET:/projects"                      1;
    "HEAD:/projects"                     1;
    "GET:/privacy"                       1;
    "HEAD:/privacy"                      1;
    ~^(?:GET|HEAD):/projects/[^/]+$       1;
}

map $http_cookie $portfolio_has_cookie {
    default 1;
    ""      0;
}

# The service worker sends this header immediately after a deploy/CMS update.
map "$portfolio_public_page:$http_x_portfolio_cache_refresh" $portfolio_skip_cache {
    default 1;
    "1:"    0;
}

# URLs carrying the application's content fingerprint can be cached forever.
map $arg_v $portfolio_static_cache_control {
    default "public, max-age=31536000, immutable";
    ""      "public, max-age=86400, stale-while-revalidate=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name darkguyaiman.com www.darkguyaiman.com;

    root /var/www/my-portfolio/public;

    server_tokens off;
    client_max_body_size 160m;
    client_body_timeout 30s;
    keepalive_timeout 65s;

    sendfile on;
    tcp_nopush on;
    etag on;
    if_modified_since exact;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        font/ttf
        font/otf
        image/svg+xml
        text/css
        text/plain
        text/xml;

    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log warn;

    include /etc/nginx/snippets/portfolio-security-headers.conf;

    # The browser must revalidate the worker so deployments can update it.
    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
    }

    # CMS uploads have timestamp/randomized filenames, so they are immutable.
    location ^~ /uploads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        access_log off;
        log_not_found off;
    }

    # Keep hidden files unreachable even if their extension looks static.
    # Certbot's ACME path remains available when TLS is added later.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    # Nginx serves static content without waking the Node process.
    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|mjs|otf|pdf|png|svg|ttf|webmanifest|webp|woff2?)$ {
        try_files $uri @portfolio_node_uncached;
        add_header Cache-Control $portfolio_static_cache_control always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Accept-Encoding "";
        proxy_socket_keepalive on;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_hide_header X-Powered-By;

        proxy_cache portfolio_html;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_bypass $portfolio_skip_cache $portfolio_has_cookie $http_authorization;
        proxy_no_cache $portfolio_skip_cache $portfolio_has_cookie $http_authorization $upstream_http_set_cookie;
        proxy_ignore_headers Expires Cache-Control;
        proxy_cache_valid 200 1m;
        proxy_cache_valid 301 302 10m;
        proxy_cache_valid 404 30s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

        add_header X-Portfolio-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
    }

    # Missing static paths reach Express's custom 404 without entering cache.
    location @portfolio_node_uncached {
        proxy_pass http://portfolio_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        proxy_cache off;
    }
}
